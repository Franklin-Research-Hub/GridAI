name: Build and publish GridAI (SEGDA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r requirements.txt
          npm install -g mapshaper@0.7.101
      - name: Run pipeline (audit + validation gate; a FAIL stops the build)
        run: python pipeline/segda_pipeline.py static_inputs out
      - name: Simplify geometry for the web map
        run: MAPSHAPER=mapshaper bash scripts/make_topo.sh out
      - name: Build site (refuses unless both the California and national gates passed)
        run: python scripts/build_site.py out site national_build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
